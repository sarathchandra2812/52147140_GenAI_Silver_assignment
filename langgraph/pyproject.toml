[project]
name = "local-bi-langgraph"
version = "0.1.0"
description = "Local Business Intelligence Assistant powered by LangGraph and Streamlit"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "streamlit>=1.38.0,<2.0.0",
    "langgraph>=0.2.61,<1.0.0",
    "langchain-core>=0.3.30,<1.0.0",
    "langchain-google-genai>=2.0.0,<3.0.0",
    "langsmith>=0.3.45,<1.0.0",
    "pandas>=2.2.0,<3.0.0",
    "plotly>=5.0.0,<7.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "tabulate>=0.10.0,<1.0.0",
    "watchdog (>=6.0.0,<7.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
]

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py311"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
